<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fluxograma – Engenharia Química (EEL-USP)</title>

<style>
body {
  margin: 0;
  background: #2b2b2b;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  color: #4da3ff;
  margin: 20px;
}

#container {
  position: relative;
  padding: 40px;
}

/* ===== MATÉRIAS ===== */
.materias {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
}

.materia {
  background: black;
  border: 2px solid #4da3ff;
  border-radius: 6px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
  position: relative;
  z-index: 2;
}

/* ===== SVG DAS SETAS ===== */
#arrows {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

line {
  stroke: #4da3ff;
  stroke-width: 2;
  opacity: 0.15;
  transition: 0.2s;
}

line.active {
  opacity: 1;
  stroke-width: 4;
}
</style>
</head>

<body>

<h1>1º Período – Engenharia Química (EEL-USP)</h1>

<div id="container">
  <svg id="arrows"></svg>

  <div class="materias">
    <div class="materia" id="C1">Cálculo I</div>
    <div class="materia" id="GA">Geometria Analítica</div>
    <div class="materia" id="LIDT">Leitura e Interpretação de Desenho Técnico</div>
    <div class="materia" id="IEQ">Introdução à Engenharia Química</div>
    <div class="materia" id="QGE">Química Geral Experimental</div>
    <div class="materia" id="FQE1">Fundamentos de Química para Engenharia I</div>
    <div class="materia" id="NE">Nivelamento para Engenharia</div>
    <div class="materia" id="EAC">Escrita Acadêmico-Científica</div>
  </div>
</div>

<script>
/* ===== PRÉ-REQUISITOS (EXEMPLO) =====
   Ajuste depois se quiser.
*/
const conexoes = [
  ["GA","C1"],
  ["C1","QGE"],
  ["FQE1","QGE"]
];

const svg = document.getElementById("arrows");
const container = document.getElementById("container");
let linhas = [];
let fixado = null;

/* ===== DESENHAR SETAS ===== */
function desenharSetas() {
  const r = container.getBoundingClientRect();
  svg.setAttribute("width", r.width);
  svg.setAttribute("height", r.height);
  svg.innerHTML = "";
  linhas = [];

  conexoes.forEach(([from, to]) => {
    const A = document.getElementById(from);
    const B = document.getElementById(to);
    if (!A || !B) return;

    const a = A.getBoundingClientRect();
    const b = B.getBoundingClientRect();

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.left + a.width/2 - r.left);
    line.setAttribute("y1", a.bottom - r.top);
    line.setAttribute("x2", b.left + b.width/2 - r.left);
    line.setAttribute("y2", b.top - r.top);

    line.dataset.from = from;
    line.dataset.to = to;

    svg.appendChild(line);
    linhas.push(line);
  });
}

/* ===== CLIQUE FIXA / DESFIXA ===== */
document.querySelectorAll(".materia").forEach(m => {
  m.addEventListener("click", () => {
    if (fixado === m.id) {
      fixado = null;
      linhas.forEach(l => l.classList.remove("active"));
    } else {
      fixado = m.id;
      linhas.forEach(l =>
        l.classList.toggle(
          "active",
          l.dataset.from === m.id || l.dataset.to === m.id
        )
      );
    }
  });
});

window.addEventListener("load", desenharSetas);
window.addEventListener("resize", desenharSetas);
</script>

</body>
</html>
