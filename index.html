 body {

<body>

<h1>Fluxograma – Engenharia Química (EEL-USP)</h1>

%% =======================

%% =======================
classDef materia fill:#111111,stroke:#0d47a1,stroke-width:2px,color:#e3f2fd;

style P1 fill:#111111,stroke:#333333,stroke-width:2px

<div class="mermaid">
graph TB

%% =======================
