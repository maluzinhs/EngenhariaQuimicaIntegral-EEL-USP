<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Fluxograma – Engenharia Química (EEL-USP)</title>

<style>
/* ===== GERAL ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #2b2b2b;
  color: #fff;
}

h1 {
  text-align: center;
  color: #4da3ff;
  margin: 20px 0;
}

/* ===== GRID DOS PERÍODOS ===== */
#grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: auto;
  gap: 60px 40px;
  padding: 40px;
}

/* ===== PERÍODO ===== */
.periodo {
  grid-column: 1 / -1;
}

.periodo h2 {
  color: #4da3ff;
  margin-bottom: 15px;
}

/* ===== MATÉRIAS ===== */
.materias {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 20px;
}

.materia {
  background: #000;
  border: 2px solid #4da3ff;
  border-radius: 6px;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  position: relative;
  z-index: 2;
}

.materia:hover {
  box-shadow: 0 0 12px #4da3ff;
}

/* ===== SVG DAS SETAS ===== */
svg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

line {
  stroke: #4da3ff;
  stroke-width: 2;
  opacity: 0.08;
  marker-end: url(#arrow);
  transition: opacity 0.2s, stroke-width 0.2s;
}

line.active {
  opacity: 1;
  stroke-width: 4;
}
</style>
</head>

<body>

<h1>Fluxograma – Engenharia Química (EEL-USP)</h1>

<div id="grid">

  <!-- SVG DAS SETAS -->
  <svg id="arrows">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#4da3ff" />
      </marker>
    </defs>
  </svg>

  <!-- 1º PERÍODO -->
  <div class="periodo">
    <h2>1º Período</h2>
    <div class="materias">
      <div class="materia" id="C1">Cálculo I</div>
      <div class="materia" id="GA">Geometria Analítica</div>
      <div class="materia" id="FQE1">Fund. Química Eng. I</div>
    </div>
  </div>

  <!-- 2º PERÍODO -->
  <div class="periodo">
    <h2>2º Período</h2>
    <div class="materias">
      <div class="materia" id="C2">Cálculo II</div>
      <div class="materia" id="AL">Álgebra Linear</div>
      <div class="materia" id="QGE">Química Geral Exp.</div>
    </div>
  </div>

  <!-- 3º PERÍODO -->
  <div class="periodo">
    <h2>3º Período</h2>
    <div class="materias">
      <div class="materia" id="QO1">Química Orgânica I</div>
    </div>
  </div>

</div>

<script>
/* ===== CONEXÕES ===== */
const conexoes = [
  ["C1", "C2"],
  ["GA", "AL"],
  ["FQE1", "QGE"],
  ["QGE", "QO1"]
];

const svg = document.getElementById("arrows");
const linhas = [];

function desenhar() {
  svg.innerHTML = svg.innerHTML; // limpa linhas
  linhas.length = 0;

  conexoes.forEach(([from, to]) => {
    const a = document.getElementById(from).getBoundingClientRect();
    const b = document.getElementById(to).getBoundingClientRect();
    const g = document.getElementById("grid").getBoundingClientRect();

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

    line.setAttribute("x1", a.left + a.width / 2 - g.left);
    line.setAttribute("y1", a.top + a.height - g.top);
    line.setAttribute("x2", b.left + b.width / 2 - g.left);
    line.setAttribute("y2", b.top - g.top);

    line.dataset.from = from;
    line.dataset.to = to;

    svg.appendChild(line);
    linhas.push(line);
  });
}

window.addEventListener("load", desenhar);
window.addEventListener("resize", desenhar);

/* ===== HOVER ===== */
document.querySelectorAll(".materia").forEach(m => {
  m.addEventListener("mouseenter", () => {
    linhas.forEach(l => {
      if (l.dataset.from === m.id || l.dataset.to === m.id) {
        l.classList.add("active");
      }
    });
  });

  m.addEventListener("mouseleave", () => {
    linhas.forEach(l => l.classList.remove("active"));
  });
});
</script>

</body>
</html>
